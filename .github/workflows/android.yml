name: App Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Preparar la app
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/
          cp icon-only.png assets/
      - name: Crear Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0F2A30' --splashBackgroundColor '#F6FAF9' || echo "Iconos por defecto"
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: airlimp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
